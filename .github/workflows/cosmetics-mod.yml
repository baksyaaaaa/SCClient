name: SC Cosmetics mod

# Builds the in-game cosmetics mod (mod/) for each Minecraft version and puts the jars on the
# "cosmetics-latest" release, where the launcher downloads them from.
on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - ".github/workflows/cosmetics-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            java: 21
            newer: false
          - mc: "26.3"
            java: 25
            newer: true
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Pick the Minecraft version
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          if [ "${{ matrix.newer }}" = "true" ]; then
            cp build-26.gradle build.gradle
            python3 port26.py
            sed -i 's/"minecraft": "[^"]*"/"minecraft": ">=26.1"/; s/"java": "[^"]*"/"java": ">=25"/' src/main/resources/fabric.mod.json
          else
            sed -i 's/"minecraft": "[^"]*"/"minecraft": ">=1.21.11 <1.22"/' src/main/resources/fabric.mod.json
          fi

      - name: Look up the newest Fabric Loader and Fabric API for this Minecraft version
        run: |
          MC=${{ matrix.mc }}
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS -A "sc-client-ci" -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                  --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "Minecraft $MC | Fabric Loader $LOADER | Fabric API $API"
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$API/" gradle.properties; fi

      - name: Build
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show the cause
        if: failure()
        run: |
          echo "### Build failed for Minecraft ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|What went wrong" -A3 build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Name the jar after the Minecraft version
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          cp "$JAR" "build/sc-cosmetics-${{ matrix.mc }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: sc-cosmetics-${{ matrix.mc }}
          path: mod/build/sc-cosmetics-${{ matrix.mc }}.jar

      - name: Put the jar on the cosmetics-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=cosmetics-latest
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "build/sc-cosmetics-${{ matrix.mc }}.jar" --clobber && break
            else
              gh release create "$TAG" "build/sc-cosmetics-${{ matrix.mc }}.jar" --title "SC Client Cosmetics mod" \
                --notes "The in-game cosmetics mod. The launcher downloads it by itself." --latest=false && break
            fi
            sleep $((RANDOM % 8 + 2))
          done
